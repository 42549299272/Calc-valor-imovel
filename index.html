<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Precificador Imobiliário 360° - Wallet Edition</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            pine: {
              800: '#0b3d2c',
              900: '#072e21',
              950: '#041f16',
            },
            limeAccent: {
              300: '#d9f99d',
              400: '#a3e635',
              500: '#84cc16',
            }
          },
          boxShadow: {
            'glow-lime': '0 0 25px -5px rgba(163, 230, 53, 0.35)',
            'soft': '0 10px 30px -5px rgba(0, 0, 0, 0.05)',
            'float': '0 15px 35px -5px rgba(4, 31, 22, 0.3)',
          }
        }
      }
    }
  </script>
  <!-- Import Map -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.2.0",
      "react-dom": "https://esm.sh/react-dom@18.2.0",
      "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
      "lucide-react": "https://esm.sh/lucide-react@0.344.0?external=react",
      "recharts": "https://esm.sh/recharts@2.12.2?external=react,react-dom",
      "clsx": "https://esm.sh/clsx@2.1.0",
      "tailwind-merge": "https://esm.sh/tailwind-merge@2.2.1"
    }
  }
  </script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
      -webkit-font-smoothing: antialiased;
    }
    .animate-fadeIn {
      animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="w-full h-auto min-h-screen bg-slate-100 text-slate-900 pb-28">
  <div id="root" class="w-full max-w-4xl mx-auto p-2 sm:p-4 md:p-6"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useMemo } from 'react';
    import { createRoot } from 'react-dom/client';
    import { 
      Building2, DollarSign, TrendingUp, CheckCircle2, Sliders, Sparkles, Home, 
      ShieldCheck, Save, RotateCcw, Share2, Award, Zap, Eye, EyeOff,
      Trash2, Check, FileText, ArrowUpRight, Compass, Shield, Layers, Bell,
      SlidersHorizontal, ArrowDown, ArrowUp, RefreshCw, Send, PieChart, UserCheck
    } from 'lucide-react';
    import { 
      ResponsiveContainer, BarChart, Bar, XAxis, YAxis, Tooltip, Cell
    } from 'recharts';

    const PROPERTY_TYPES = [
      { id: 'apartamento', name: 'Apartamento Padrão', baseFactor: 1.0 },
      { id: 'casa_rua', name: 'Casa de Rua', baseFactor: 0.95 },
      { id: 'casa_condominio', name: 'Casa em Condomínio', baseFactor: 1.12 },
      { id: 'cobertura', name: 'Cobertura VIP', baseFactor: 1.25 },
      { id: 'studio', name: 'Studio / Kitnet', baseFactor: 1.05 }
    ];

    const CONSERVATION_LEVELS = [
      { id: 'reforma', label: 'Para Reforma', desc: 'Sistemas antigos e acabamento desatualizado', pct: -0.15, badge: '-15%' },
      { id: 'original', label: 'Conservado', desc: 'Habitável, padrão de época', pct: 0.0, badge: 'Padrão' },
      { id: 'bom', label: 'Bom Estado', desc: 'Pronto p/ morar, pintura nova', pct: 0.08, badge: '+8%' },
      { id: 'reformado', label: 'Alto Padrão', desc: 'Reformado c/ marcenaria e iluminação LED', pct: 0.18, badge: '+18%' }
    ];

    const ATTRIBUTES_LIST = [
      { id: 'sol_manha', label: 'Sol da Manhã', pct: 4, icon: Sparkles, desc: 'Conforto térmico nobre' },
      { id: 'vista_livre', label: 'Vista Livre', pct: 6, icon: Eye, desc: 'Privacidade total & brisa' },
      { id: 'varanda_gourmet', label: 'Varanda Gourmet', pct: 5, icon: Home, desc: 'Integrada c/ churrasqueira' },
      { id: 'armarios', label: 'Armários Planejados', pct: 6, icon: CheckCircle2, desc: 'Móveis fixos sob medida' },
      { id: 'lazer_completo', label: 'Condomínio Clube', pct: 7, icon: Award, desc: 'Piscina, academia e área verde' },
      { id: 'portaria_24h', label: 'Portaria 24h & Segurança', pct: 4, icon: ShieldCheck, desc: 'Controle rigoroso de acesso' },
      { id: 'ar_condicionado', label: 'Climatizado', pct: 3, icon: Zap, desc: 'Splits nas áreas principais' },
      { id: 'andar_alto', label: 'Andar Alto (8º+)', pct: 5, icon: Building2, desc: 'Silêncio urbano e vista' }
    ];

    const PRESET_SQM_PRICES = [
      { label: 'Marco Popular', value: 7600 },
      { label: 'Marco Médio', value: 8500 },
      { label: 'Nobre Belém', value: 11000 },
      { label: 'Alto Padrão', value: 16500 }
    ];

    function App() {
      // Inputs
      const [title, setTitle] = useState('Apto 1202 - Ed. Marco Prime');
      const [ownerName, setOwnerName] = useState('Dr. Marcelo');
      const [neighborhood, setNeighborhood] = useState('Marco, Belém - PA');
      const [propertyType, setPropertyType] = useState('apartamento');
      const [area, setArea] = useState(85);
      const [baseSqmPrice, setBaseSqmPrice] = useState(8500);
      const [conservation, setConservation] = useState('bom');
      const [garages, setGarages] = useState(2);
      const [selectedAttrs, setSelectedAttrs] = useState(['sol_manha', 'armarios', 'portaria_24h', 'varanda_gourmet']);
      const [commissionRate, setCommissionRate] = useState(6);

      // UI States
      const [savedEvals, setSavedEvals] = useState([]);
      const [toast, setToast] = useState(null);
      const [copied, setCopied] = useState(false);
      const [activeTab, setActiveTab] = useState('calculator'); // 'calculator', 'analytics', 'history'
      const [activeSection, setActiveSection] = useState('imovel'); // 'imovel', 'atributos', 'liquidez'
      const [hideBalance, setHideBalance] = useState(false);
      const [confirmDeleteAll, setConfirmDeleteAll] = useState(false);

      useEffect(() => {
        try {
          const stored = localStorage.getItem('precificador_wallet_history');
          if (stored) setSavedEvals(JSON.parse(stored));
        } catch (e) {
          console.error(e);
        }
      }, []);

      const saveToStorage = (list) => {
        try {
          localStorage.setItem('precificador_wallet_history', JSON.stringify(list));
        } catch (e) {
          console.error(e);
        }
      };

      const showNotification = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3000);
      };

      const calculations = useMemo(() => {
        const numArea = Math.max(1, Number(area) || 0);
        const numPriceSqm = Math.max(100, Number(baseSqmPrice) || 0);
        
        const typeObj = PROPERTY_TYPES.find(t => t.id === propertyType) || PROPERTY_TYPES[0];
        const rawBaseValue = numArea * numPriceSqm * typeObj.baseFactor;

        const consObj = CONSERVATION_LEVELS.find(c => c.id === conservation) || CONSERVATION_LEVELS[1];
        const consImpactPct = consObj.pct;

        const attrPctSum = selectedAttrs.reduce((acc, attrId) => {
          const item = ATTRIBUTES_LIST.find(a => a.id === attrId);
          return acc + (item ? item.pct : 0);
        }, 0) / 100;

        const garageBonusPct = Math.max(0, (garages - 1)) * 0.05;
        const totalMultiplier = 1 + consImpactPct + attrPctSum + garageBonusPct;

        const fairValue = rawBaseValue * totalMultiplier;
        const effectiveSqmPrice = numArea > 0 ? fairValue / numArea : 0;

        const quickSaleValue = fairValue * 0.92;
        const ceilingValue = fairValue * 1.08;
        const addedValue = fairValue - rawBaseValue;

        const commissionAmount = fairValue * (commissionRate / 100);
        const netValue = fairValue - commissionAmount;

        return {
          numArea,
          numPriceSqm,
          typeObj,
          rawBaseValue,
          consObj,
          consImpactPct,
          attrPctSum,
          garageBonusPct,
          totalMultiplier,
          fairValue,
          effectiveSqmPrice,
          quickSaleValue,
          ceilingValue,
          addedValue,
          commissionAmount,
          netValue
        };
      }, [area, baseSqmPrice, propertyType, conservation, selectedAttrs, garages, commissionRate]);

      const formatCurrency = (val) => {
        if (hideBalance) return '•••••••••';
        return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 }).format(val);
      };

      const toggleAttribute = (attrId) => {
        if (selectedAttrs.includes(attrId)) {
          setSelectedAttrs(selectedAttrs.filter(id => id !== attrId));
        } else {
          setSelectedAttrs([...selectedAttrs, attrId]);
        }
      };

      const handleSave = () => {
        const record = {
          id: Date.now().toString(),
          date: new Date().toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }),
          title: title || 'Imóvel sem título',
          ownerName: ownerName || 'Cliente',
          neighborhood: neighborhood || 'Geral',
          fairValue: calculations.fairValue,
          area: calculations.numArea,
          effectiveSqmPrice: calculations.effectiveSqmPrice,
          state: { title, ownerName, neighborhood, propertyType, area, baseSqmPrice, conservation, garages, selectedAttrs, commissionRate }
        };

        const updated = [record, ...savedEvals];
        setSavedEvals(updated);
        saveToStorage(updated);
        showNotification('Avaliação arquivada na carteira!');
      };

      const handleLoad = (rec) => {
        const s = rec.state;
        if (!s) return;
        setTitle(s.title || '');
        setOwnerName(s.ownerName || '');
        setNeighborhood(s.neighborhood || '');
        setPropertyType(s.propertyType || 'apartamento');
        setArea(s.area || 85);
        setBaseSqmPrice(s.baseSqmPrice || 8500);
        setConservation(s.conservation || 'bom');
        setGarages(s.garages || 2);
        setSelectedAttrs(s.selectedAttrs || []);
        setCommissionRate(s.commissionRate || 6);
        setActiveTab('calculator');
        showNotification('Avaliação restaurada!');
      };

      const handleDelete = (id) => {
        const updated = savedEvals.filter(e => e.id !== id);
        setSavedEvals(updated);
        saveToStorage(updated);
        showNotification('Item removido da carteira.');
      };

      const handleCopyWhatsApp = () => {
        const summary = `*LAUDO EXECUTIVO DE PRECIFICAÇÃO* 🏢
---
📍 *Imóvel:* ${title} (${neighborhood})
👤 *Cliente:* ${ownerName}
📐 *Área Útil:* ${calculations.numArea} m² | 🚗 *Vagas:* ${garages}

💵 *PREÇO ESTIMADO DE MERCADO:*
• *Valor Justo:* ${new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 }).format(calculations.fairValue)}
• *Metro Quadrado Efetivo:* ${new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 }).format(calculations.effectiveSqmPrice)}/m²

🎯 *ESTRATÉGIA DE LIQUIDEZ:*
⚡ *Venda Rápida (<30d):* ${new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 }).format(calculations.quickSaleValue)}
⚖️ *Preço Justo (Ideal):* ${new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 }).format(calculations.fairValue)}
🚀 *Preço Teto / Teste:* ${new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 }).format(calculations.ceilingValue)}

💰 *LÍQUIDO ESTIMADO DO VENDEDOR:*
• Comissão (${commissionRate}%): ${new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 }).format(calculations.commissionAmount)}
• *Líquido na Conta:* ${new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 }).format(calculations.netValue)}

_Avaliação gerada via Precificador Imobiliário 360°._`;

        const textarea = document.createElement('textarea');
        textarea.value = summary;
        document.body.appendChild(textarea);
        textarea.select();
        try {
          document.execCommand('copy');
          setCopied(true);
          showNotification('Resumo formatado copiado!');
          setTimeout(() => setCopied(false), 2000);
        } catch (e) {
          console.error(e);
        }
        document.body.removeChild(textarea);
      };

      const chartData = [
        { name: 'Base Região', valor: Math.round(calculations.rawBaseValue), color: '#94a3b8' },
        { name: 'Venda Rápida', valor: Math.round(calculations.quickSaleValue), color: '#f59e0b' },
        { name: 'Preço Justo', valor: Math.round(calculations.fairValue), color: '#a3e635' },
        { name: 'Preço Teto', valor: Math.round(calculations.ceilingValue), color: '#38bdf8' }
      ];

      return (
        <div className="space-y-4 max-w-xl mx-auto">
          
          {/* Toast Notification */}
          {toast && (
            <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-pine-900 text-limeAccent-300 px-4 py-2.5 rounded-full shadow-2xl border border-limeAccent-400/30 flex items-center gap-2 text-xs font-semibold animate-fadeIn">
              <CheckCircle2 className="w-4 h-4 text-limeAccent-400" />
              <span>{toast}</span>
            </div>
          )}

          {}
          {/* Mobile Shell Top Dark Green Header (Reference Match) */}
          <div className="bg-gradient-to-b from-pine-900 via-pine-900 to-pine-950 text-white rounded-3xl p-5 sm:p-6 shadow-2xl relative overflow-hidden border border-pine-800">
            
            {/* Top Bar Greeting & Bell */}
            <div className="flex items-center justify-between mb-4">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-full bg-pine-800 border border-limeAccent-400/30 p-0.5 overflow-hidden flex items-center justify-center text-limeAccent-400 font-extrabold text-sm">
                  <UserCheck className="w-5 h-5" />
                </div>
                <div>
                  <span className="text-[11px] text-emerald-300/80 font-medium block leading-tight">Olá, Corretor Pro</span>
                  <span className="text-xs font-bold text-white block">{title || 'Novo Imóvel'}</span>
                </div>
              </div>

              <div className="flex items-center gap-2">
                <button 
                  onClick={() => setHideBalance(!hideBalance)} 
                  className="w-9 h-9 bg-pine-800/80 hover:bg-pine-800 rounded-full flex items-center justify-center text-emerald-200 transition-all border border-pine-800"
                  title="Ocultar/Exibir Valores"
                >
                  {hideBalance ? <EyeOff className="w-4 h-4 text-limeAccent-400" /> : <Eye className="w-4 h-4" />}
                </button>
                <div className="w-9 h-9 bg-pine-800/80 rounded-full flex items-center justify-center text-limeAccent-400 border border-pine-800 relative">
                  <Bell className="w-4 h-4" />
                  <span className="w-2 h-2 bg-limeAccent-400 rounded-full absolute top-2 right-2"></span>
                </div>
              </div>
            </div>

            {/* Wallet Balance Hero Metric */}
            <div className="text-center my-3">
              <span className="text-[11px] font-semibold uppercase tracking-wider text-emerald-300/90 block mb-1">
                Valor Estimado de Mercado
              </span>
              <div className="flex items-center justify-center gap-2">
                <h2 className="text-3xl sm:text-4xl font-black tracking-tight text-white">
                  {formatCurrency(calculations.fairValue)}
                </h2>
              </div>
              <p className="text-[11px] text-limeAccent-300/90 font-medium mt-1">
                {formatCurrency(calculations.effectiveSqmPrice)} / m² útil • {calculations.numArea} m²
              </p>
            </div>

            {/* Primary Action Buttons (Pill Buttons) */}
            <div className="grid grid-cols-2 gap-3 my-4">
              <button
                onClick={handleCopyWhatsApp}
                className="bg-limeAccent-400 hover:bg-limeAccent-500 active:scale-95 text-pine-950 font-extrabold py-2.5 px-4 rounded-full transition-all shadow-glow-lime flex items-center justify-center gap-2 text-xs"
              >
                {copied ? <Check className="w-4 h-4" /> : <Send className="w-4 h-4" />}
                {copied ? 'Copiado!' : 'Enviar WhatsApp'}
              </button>

              <button
                onClick={handleSave}
                className="bg-pine-800 hover:bg-pine-800/80 active:scale-95 text-limeAccent-300 font-bold py-2.5 px-4 rounded-full border border-limeAccent-400/30 transition-all flex items-center justify-center gap-2 text-xs"
              >
                <Save className="w-4 h-4 text-limeAccent-400" />
                Salvar Laudo
              </button>
            </div>

            {/* Inner Sub-Card Preset Tabs (Reference Match: 'Your Wallet' Container) */}
            <div className="bg-pine-800/70 backdrop-blur-md rounded-2xl p-3 border border-pine-800/80 mt-2">
              <div className="flex items-center justify-between text-[11px] text-emerald-200/90 font-medium mb-2 px-1">
                <span>Padrão M² Região:</span>
                <span className="text-limeAccent-400 font-bold">{neighborhood}</span>
              </div>
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-1.5">
                {PRESET_SQM_PRICES.map((preset) => (
                  <button
                    key={preset.value}
                    onClick={() => setBaseSqmPrice(preset.value)}
                    className={`text-[10px] font-bold py-1.5 px-2 rounded-xl border transition-all truncate ${
                      Number(baseSqmPrice) === preset.value
                        ? 'bg-limeAccent-400 text-pine-950 border-limeAccent-400 shadow-sm'
                        : 'bg-pine-900/60 text-emerald-100 border-pine-700 hover:bg-pine-900'
                    }`}
                  >
                    {preset.label}
                  </button>
                ))}
              </div>
            </div>

          </div>

          {}
          {/* Quick Action Circles Grid (Reference Match: Receive, Request, Exchange, Withdraw) */}
          <div className="bg-white rounded-3xl p-4 shadow-soft border border-slate-200/80">
            <div className="grid grid-cols-4 gap-2 text-center">
              
              <button 
                onClick={() => { setActiveTab('calculator'); setActiveSection('imovel'); }}
                className="flex flex-col items-center gap-1.5 group"
              >
                <div className={`w-12 h-12 rounded-full border-2 flex items-center justify-center transition-all ${
                  activeTab === 'calculator' && activeSection === 'imovel'
                    ? 'border-emerald-500 bg-emerald-50 text-emerald-600 shadow-md'
                    : 'border-emerald-200 text-emerald-600 hover:bg-emerald-50'
                }`}>
                  <Building2 className="w-5 h-5" />
                </div>
                <span className="text-[10px] font-bold text-slate-700">Imóvel</span>
              </button>

              <button 
                onClick={() => { setActiveTab('calculator'); setActiveSection('atributos'); }}
                className="flex flex-col items-center gap-1.5 group"
              >
                <div className={`w-12 h-12 rounded-full border-2 flex items-center justify-center transition-all ${
                  activeTab === 'calculator' && activeSection === 'atributos'
                    ? 'border-rose-500 bg-rose-50 text-rose-600 shadow-md'
                    : 'border-rose-200 text-rose-600 hover:bg-rose-50'
                }`}>
                  <SlidersHorizontal className="w-5 h-5" />
                </div>
                <span className="text-[10px] font-bold text-slate-700">Atributos</span>
              </button>

              <button 
                onClick={() => setActiveTab('analytics')}
                className="flex flex-col items-center gap-1.5 group"
              >
                <div className={`w-12 h-12 rounded-full border-2 flex items-center justify-center transition-all ${
                  activeTab === 'analytics'
                    ? 'border-indigo-500 bg-indigo-50 text-indigo-600 shadow-md'
                    : 'border-indigo-200 text-indigo-600 hover:bg-indigo-50'
                }`}>
                  <PieChart className="w-5 h-5" />
                </div>
                <span className="text-[10px] font-bold text-slate-700">Análise</span>
              </button>

              <button 
                onClick={() => setActiveTab('history')}
                className="flex flex-col items-center gap-1.5 group"
              >
                <div className={`w-12 h-12 rounded-full border-2 flex items-center justify-center transition-all ${
                  activeTab === 'history'
                    ? 'border-amber-500 bg-amber-50 text-amber-600 shadow-md'
                    : 'border-amber-200 text-amber-600 hover:bg-amber-50'
                }`}>
                  <FileText className="w-5 h-5" />
                </div>
                <span className="text-[10px] font-bold text-slate-700">
                  Histórico ({savedEvals.length})
                </span>
              </button>

            </div>
          </div>

          {}
          {/* MAIN TAB CONTENT */}
          {activeTab === 'calculator' && (
            <div className="space-y-4">
              
              {/* Section Selector Pills */}
              <div className="flex bg-slate-200/80 p-1 rounded-2xl text-xs font-bold">
                <button
                  onClick={() => setActiveSection('imovel')}
                  className={`flex-1 py-2 rounded-xl transition-all ${
                    activeSection === 'imovel' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600'
                  }`}
                >
                  1. Dados Básico
                </button>
                <button
                  onClick={() => setActiveSection('atributos')}
                  className={`flex-1 py-2 rounded-xl transition-all ${
                    activeSection === 'atributos' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600'
                  }`}
                >
                  2. Conservação & Extras
                </button>
              </div>

              {activeSection === 'imovel' ? (
                /* Step 1: Property Info Card */
                <div className="bg-white rounded-3xl p-5 border border-slate-200/80 shadow-soft space-y-4 animate-fadeIn">
                  <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                    <h3 className="text-xs font-extrabold text-slate-900 uppercase tracking-wider flex items-center gap-2">
                      <Building2 className="w-4 h-4 text-pine-800" /> Parâmetros Principais
                    </h3>
                    <span className="text-[10px] text-slate-400 font-semibold">Base de Cálculo</span>
                  </div>

                  <div className="space-y-3">
                    <div>
                      <label className="block text-[11px] font-bold text-slate-600 mb-1">Título do Imóvel / Referência</label>
                      <input
                        type="text"
                        value={title}
                        onChange={(e) => setTitle(e.target.value)}
                        placeholder="Ex: Edifício Marco Prime"
                        className="w-full px-3.5 py-2.5 text-xs font-semibold bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-pine-800 focus:bg-white focus:outline-none transition-all"
                      />
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block text-[11px] font-bold text-slate-600 mb-1">Cliente / Proprietário</label>
                        <input
                          type="text"
                          value={ownerName}
                          onChange={(e) => setOwnerName(e.target.value)}
                          placeholder="Ex: Dr. Marcelo"
                          className="w-full px-3.5 py-2.5 text-xs font-semibold bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-pine-800 focus:bg-white focus:outline-none transition-all"
                        />
                      </div>
                      <div>
                        <label className="block text-[11px] font-bold text-slate-600 mb-1">Bairro / Região</label>
                        <input
                          type="text"
                          value={neighborhood}
                          onChange={(e) => setNeighborhood(e.target.value)}
                          placeholder="Ex: Marco, Belém"
                          className="w-full px-3.5 py-2.5 text-xs font-semibold bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-pine-800 focus:bg-white focus:outline-none transition-all"
                        />
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block text-[11px] font-bold text-slate-600 mb-1">Tipo de Imóvel</label>
                        <select
                          value={propertyType}
                          onChange={(e) => setPropertyType(e.target.value)}
                          className="w-full px-3 py-2.5 text-xs font-semibold bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-pine-800 focus:bg-white focus:outline-none transition-all"
                        >
                          {PROPERTY_TYPES.map(t => (
                            <option key={t.id} value={t.id}>{t.name}</option>
                          ))}
                        </select>
                      </div>

                      <div>
                        <label className="block text-[11px] font-bold text-slate-600 mb-1">Área Privativa (m²)</label>
                        <div className="relative">
                          <input
                            type="number"
                            min="1"
                            max="3000"
                            value={area}
                            onChange={(e) => setArea(e.target.value)}
                            className="w-full px-3 py-2.5 text-xs font-bold bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-pine-800 focus:bg-white focus:outline-none pr-8"
                          />
                          <span className="absolute right-2.5 top-2.5 text-[10px] font-extrabold text-slate-400">m²</span>
                        </div>
                      </div>
                    </div>

                    <div>
                      <label className="block text-[11px] font-bold text-slate-600 mb-1">Preço Médio / m² do Bairro (R$)</label>
                      <div className="relative">
                        <input
                          type="number"
                          step="100"
                          min="1000"
                          value={baseSqmPrice}
                          onChange={(e) => setBaseSqmPrice(e.target.value)}
                          className="w-full px-3.5 py-2.5 text-xs font-bold bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-pine-800 focus:bg-white focus:outline-none pl-8"
                        />
                        <span className="absolute left-3 top-2.5 text-xs font-bold text-slate-400">R$</span>
                      </div>
                    </div>

                    <button
                      type="button"
                      onClick={() => setActiveSection('atributos')}
                      className="w-full bg-pine-900 hover:bg-pine-950 text-limeAccent-300 font-bold py-3 rounded-2xl text-xs transition-all flex items-center justify-center gap-2 mt-2 shadow-md"
                    >
                      Avançar para Atributos & Conservação
                      <ArrowUpRight className="w-4 h-4 text-limeAccent-400" />
                    </button>
                  </div>
                </div>
              ) : (
                /* Step 2: Conservation & Attributes Card */
                <div className="space-y-4 animate-fadeIn">
                  
                  {/* Conservation Selector */}
                  <div className="bg-white rounded-3xl p-5 border border-slate-200/80 shadow-soft space-y-3">
                    <h3 className="text-xs font-extrabold text-slate-900 uppercase tracking-wider">Estado de Conservação</h3>
                    <div className="grid grid-cols-2 gap-2">
                      {CONSERVATION_LEVELS.map((item) => {
                        const isSelected = conservation === item.id;
                        return (
                          <button
                            key={item.id}
                            type="button"
                            onClick={() => setConservation(item.id)}
                            className={`p-3 rounded-2xl border text-left transition-all ${
                              isSelected
                                ? 'border-pine-800 bg-pine-900 text-white shadow-md'
                                : 'border-slate-200 bg-slate-50/50 hover:bg-slate-100 text-slate-700'
                            }`}
                          >
                            <div className="flex items-center justify-between mb-0.5">
                              <span className="text-xs font-extrabold">{item.label}</span>
                              <span className={`text-[9px] font-black px-1.5 py-0.2 rounded-md ${
                                isSelected 
                                  ? 'bg-limeAccent-400 text-pine-950' 
                                  : item.pct > 0 ? 'bg-emerald-100 text-emerald-800' : item.pct < 0 ? 'bg-rose-100 text-rose-800' : 'bg-slate-200 text-slate-700'
                              }`}>
                                {item.badge}
                              </span>
                            </div>
                            <span className={`text-[10px] block leading-tight ${isSelected ? 'text-emerald-200/80' : 'text-slate-500'}`}>
                              {item.desc}
                            </span>
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  {/* Garages & Extras */}
                  <div className="bg-white rounded-3xl p-4 border border-slate-200/80 shadow-soft flex items-center justify-between">
                    <div>
                      <span className="text-xs font-extrabold text-slate-900 block">Vagas de Garagem</span>
                      <span className="text-[10px] text-slate-500">+5% por vaga extra acima de 1</span>
                    </div>
                    <div className="flex items-center gap-1">
                      {[0, 1, 2, 3, 4].map((g) => (
                        <button
                          key={g}
                          type="button"
                          onClick={() => setGarages(g)}
                          className={`w-7 h-7 rounded-lg text-xs font-black transition-all ${
                            garages === g
                              ? 'bg-pine-900 text-limeAccent-400 shadow-sm'
                              : 'bg-slate-100 text-slate-600 border border-slate-200'
                          }`}
                        >
                          {g}
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* Attributes Grid */}
                  <div className="bg-white rounded-3xl p-5 border border-slate-200/80 shadow-soft space-y-3">
                    <div className="flex items-center justify-between">
                      <h3 className="text-xs font-extrabold text-slate-900 uppercase tracking-wider">Diferenciais Atribuidos</h3>
                      <span className="text-xs font-black text-pine-800 bg-limeAccent-300/40 px-2 py-0.5 rounded-full">
                        +{(calculations.attrPctSum * 100).toFixed(0)}%
                      </span>
                    </div>

                    <div className="grid grid-cols-2 gap-2">
                      {ATTRIBUTES_LIST.map((attr) => {
                        const IconComp = attr.icon;
                        const isChecked = selectedAttrs.includes(attr.id);
                        return (
                          <button
                            key={attr.id}
                            type="button"
                            onClick={() => toggleAttribute(attr.id)}
                            className={`flex items-start gap-2.5 p-2.5 rounded-2xl border text-left transition-all ${
                              isChecked
                                ? 'bg-pine-900 border-pine-800 text-white shadow-sm'
                                : 'bg-slate-50/60 border-slate-200 text-slate-700 hover:bg-slate-100'
                            }`}
                          >
                            <div className={`p-1.5 rounded-xl shrink-0 mt-0.5 ${isChecked ? 'bg-limeAccent-400 text-pine-950' : 'bg-slate-200 text-slate-500'}`}>
                              <IconComp className="w-3.5 h-3.5" />
                            </div>
                            <div className="min-w-0 flex-1">
                              <div className="flex items-center justify-between">
                                <span className="text-[11px] font-bold truncate">{attr.label}</span>
                                <span className={`text-[9px] font-extrabold px-1 rounded ml-1 shrink-0 ${isChecked ? 'bg-pine-800 text-limeAccent-300' : 'text-slate-500'}`}>
                                  +{attr.pct}%
                                </span>
                              </div>
                              <span className={`text-[9px] block truncate mt-0.5 ${isChecked ? 'text-emerald-200/70' : 'text-slate-400'}`}>
                                {attr.desc}
                              </span>
                            </div>
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  {/* Commission Rate Bar */}
                  <div className="bg-white rounded-3xl p-4 border border-slate-200/80 shadow-soft flex items-center justify-between">
                    <div>
                      <span className="text-xs font-extrabold text-slate-900 block">Comissão do Corretor</span>
                      <span className="text-[10px] text-slate-500">Cálculo de repasse líquido</span>
                    </div>
                    <div className="flex items-center gap-1">
                      {[5, 6, 8].map((r) => (
                        <button
                          key={r}
                          type="button"
                          onClick={() => setCommissionRate(r)}
                          className={`px-3 py-1 text-xs font-black rounded-lg transition-all ${
                            commissionRate === r
                              ? 'bg-pine-900 text-limeAccent-400'
                              : 'bg-slate-100 text-slate-600 border border-slate-200'
                          }`}
                        >
                          {r}%
                        </button>
                      ))}
                    </div>
                  </div>

                </div>
              )}

            </div>
          )}

          {}
          {activeTab === 'analytics' && (
            <div className="space-y-4 animate-fadeIn">
              
              {/* Thermometer Range Cards (Reference List Style) */}
              <div className="bg-white rounded-3xl p-5 border border-slate-200/80 shadow-soft space-y-3">
                <h3 className="text-xs font-extrabold text-slate-900 uppercase tracking-wider border-b border-slate-100 pb-2">
                  Estratégia & Faixa de Liquidez
                </h3>

                <div className="space-y-2">
                  {/* Venda Rápida */}
                  <div className="flex items-center justify-between p-3 rounded-2xl bg-amber-50/60 border border-amber-200/70">
                    <div className="flex items-center gap-3">
                      <div className="w-8 h-8 rounded-full bg-amber-500 text-white flex items-center justify-center font-bold text-xs">
                        ⚡
                      </div>
                      <div>
                        <span className="text-xs font-bold text-slate-900 block">Venda Rápida (&lt;30 dias)</span>
                        <span className="text-[10px] text-amber-700 font-medium">Liquidez imediata / Oportunidade</span>
                      </div>
                    </div>
                    <span className="text-xs font-black text-amber-800">
                      {formatCurrency(calculations.quickSaleValue)}
                    </span>
                  </div>

                  {/* Preço Justo */}
                  <div className="flex items-center justify-between p-3 rounded-2xl bg-pine-900 text-white shadow-md border border-pine-800">
                    <div className="flex items-center gap-3">
                      <div className="w-8 h-8 rounded-full bg-limeAccent-400 text-pine-950 flex items-center justify-center font-bold text-xs">
                        ⚖️
                      </div>
                      <div>
                        <span className="text-xs font-extrabold text-limeAccent-300 block">Preço Justo Recomendado</span>
                        <span className="text-[10px] text-emerald-200/80 font-medium">Avaliação mercadológica ideal</span>
                      </div>
                    </div>
                    <span className="text-xs font-black text-limeAccent-400">
                      {formatCurrency(calculations.fairValue)}
                    </span>
                  </div>

                  {/* Preço Teto */}
                  <div className="flex items-center justify-between p-3 rounded-2xl bg-indigo-50/60 border border-indigo-200/70">
                    <div className="flex items-center gap-3">
                      <div className="w-8 h-8 rounded-full bg-indigo-600 text-white flex items-center justify-center font-bold text-xs">
                        🚀
                      </div>
                      <div>
                        <span className="text-xs font-bold text-slate-900 block">Preço Teto (&gt;90 dias)</span>
                        <span className="text-[10px] text-indigo-700 font-medium">Teste de mercado limite</span>
                      </div>
                    </div>
                    <span className="text-xs font-black text-indigo-800">
                      {formatCurrency(calculations.ceilingValue)}
                    </span>
                  </div>
                </div>

                {/* Net Seller Return */}
                <div className="mt-3 p-3.5 rounded-2xl bg-slate-900 text-white flex items-center justify-between text-xs">
                  <span className="text-slate-400 font-medium">Líquido do Vendedor ({100 - commissionRate}%):</span>
                  <span className="font-extrabold text-limeAccent-400 text-sm">
                    {formatCurrency(calculations.netValue)}
                  </span>
                </div>
              </div>

              {/* Recharts Comparison Chart */}
              <div className="bg-white rounded-3xl p-5 border border-slate-200/80 shadow-soft space-y-3">
                <div className="flex items-center justify-between border-b border-slate-100 pb-2">
                  <h3 className="text-xs font-extrabold text-slate-900 uppercase tracking-wider">Comparativo de Cenários</h3>
                  <span className="text-[10px] text-slate-400 font-bold">Valores em R$</span>
                </div>

                <div className="h-44 w-full pt-1">
                  <ResponsiveContainer width="100%" height="100%">
                    <BarChart data={chartData} margin={{ top: 10, right: 5, left: -25, bottom: 0 }}>
                      <XAxis dataKey="name" tick={{ fontSize: 9, fill: '#64748b' }} axisLine={false} tickLine={false} />
                      <YAxis tick={{ fontSize: 8, fill: '#94a3b8' }} axisLine={false} tickLine={false} tickFormatter={(v) => `${(v/1000).toFixed(0)}k`} />
                      <Tooltip
                        formatter={(value) => [new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 }).format(value), 'Valor']}
                        contentStyle={{ backgroundColor: '#072e21', border: 'none', borderRadius: '12px', color: '#fff', fontSize: '11px', boxShadow: '0 10px 25px -5px rgba(0,0,0,0.3)' }}
                      />
                      <Bar dataKey="valor" radius={[8, 8, 0, 0]}>
                        {chartData.map((entry, index) => (
                          <Cell key={`cell-${index}`} fill={entry.color} />
                        ))}
                      </Bar>
                    </BarChart>
                  </ResponsiveContainer>
                </div>
              </div>

              {/* Composition Breakdown */}
              <div className="bg-white rounded-3xl p-5 border border-slate-200/80 shadow-soft space-y-2 text-xs">
                <h3 className="text-xs font-extrabold text-slate-900 uppercase tracking-wider border-b border-slate-100 pb-2">
                  Composição do Valor Agregado
                </h3>
                
                <div className="flex justify-between py-1 border-b border-slate-50 text-slate-600">
                  <span>Base Bruta ({calculations.numArea}m² × R$ {calculations.numPriceSqm})</span>
                  <span className="font-bold text-slate-900">{formatCurrency(calculations.rawBaseValue)}</span>
                </div>
                <div className="flex justify-between py-1 border-b border-slate-50 text-slate-600">
                  <span>Ajuste de Conservação ({calculations.consObj.label})</span>
                  <span className={`font-bold ${calculations.consImpactPct >= 0 ? 'text-emerald-600' : 'text-rose-600'}`}>
                    {calculations.consImpactPct >= 0 ? '+' : ''}{(calculations.consImpactPct * 100).toFixed(0)}%
                  </span>
                </div>
                <div className="flex justify-between py-1 border-b border-slate-50 text-slate-600">
                  <span>Atributos Ativos ({selectedAttrs.length})</span>
                  <span className="font-bold text-emerald-600">+{(calculations.attrPctSum * 100).toFixed(0)}%</span>
                </div>
                <div className="flex justify-between py-1 border-b border-slate-50 text-slate-600">
                  <span>Bônus Vagas ({garages} vagas)</span>
                  <span className="font-bold text-emerald-600">+{(calculations.garageBonusPct * 100).toFixed(0)}%</span>
                </div>

                <div className="flex justify-between pt-2 font-extrabold border-t border-slate-200 text-pine-900">
                  <span>Valor Agregado Total:</span>
                  <span className="text-emerald-600">+{formatCurrency(calculations.addedValue)}</span>
                </div>
              </div>

            </div>
          )}

          {}
          {activeTab === 'history' && (
            <div className="bg-white rounded-3xl p-5 border border-slate-200/80 shadow-soft space-y-4 animate-fadeIn">
              <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                <div>
                  <h3 className="text-xs font-extrabold text-slate-900 uppercase tracking-wider">Histórico de Laudos</h3>
                  <span className="text-[10px] text-slate-400 font-medium">Avaliações salvas no dispositivo</span>
                </div>

                {savedEvals.length > 0 && (
                  <div>
                    {!confirmDeleteAll ? (
                      <button
                        onClick={() => setConfirmDeleteAll(true)}
                        className="text-[10px] text-rose-600 hover:text-rose-700 font-extrabold bg-rose-50 px-2.5 py-1 rounded-lg"
                      >
                        Limpar TUDO
                      </button>
                    ) : (
                      <div className="flex items-center gap-1.5">
                        <span className="text-[10px] font-bold text-slate-500">Confirma?</span>
                        <button
                          onClick={() => {
                            setSavedEvals([]);
                            saveToStorage([]);
                            setConfirmDeleteAll(false);
                            showNotification('Histórico totalmente apagado.');
                          }}
                          className="text-[10px] bg-rose-600 text-white font-black px-2 py-0.5 rounded"
                        >
                          Sim
                        </button>
                        <button
                          onClick={() => setConfirmDeleteAll(false)}
                          className="text-[10px] bg-slate-200 text-slate-700 font-bold px-2 py-0.5 rounded"
                        >
                          Não
                        </button>
                      </div>
                    )}
                  </div>
                )}
              </div>

              {savedEvals.length === 0 ? (
                <div className="text-center py-12 space-y-2">
                  <div className="w-10 h-10 bg-slate-100 text-slate-400 rounded-2xl flex items-center justify-center mx-auto">
                    <FileText className="w-5 h-5" />
                  </div>
                  <p className="text-xs font-semibold text-slate-400">Nenhum laudo salvo ainda.</p>
                  <button
                    onClick={() => setActiveTab('calculator')}
                    className="text-xs bg-pine-900 text-limeAccent-300 font-bold px-3.5 py-2 rounded-xl"
                  >
                    Fazer Primeira Precificação
                  </button>
                </div>
              ) : (
                <div className="space-y-3">
                  {savedEvals.map((rec) => (
                    <div key={rec.id} className="p-3.5 rounded-2xl border border-slate-200 bg-slate-50/50 space-y-2">
                      <div className="flex items-start justify-between gap-2">
                        <div>
                          <span className="text-[9px] text-slate-400 font-bold block">{rec.date}</span>
                          <h4 className="text-xs font-bold text-slate-900">{rec.title}</h4>
                          <span className="text-[10px] text-slate-500 block">{rec.ownerName} • {rec.neighborhood}</span>
                        </div>
                        <span className="text-xs font-black text-pine-900 bg-limeAccent-300/50 border border-limeAccent-400/40 px-2 py-0.5 rounded-lg shrink-0">
                          {formatCurrency(rec.fairValue)}
                        </span>
                      </div>

                      <div className="flex items-center justify-between text-[10px] text-slate-500 pt-2 border-t border-slate-200/60">
                        <span>{rec.area} m² • {formatCurrency(rec.effectiveSqmPrice)}/m²</span>
                        <div className="flex items-center gap-2">
                          <button
                            onClick={() => handleLoad(rec)}
                            className="text-pine-900 hover:text-pine-950 font-extrabold flex items-center gap-1"
                          >
                            <RotateCcw className="w-3 h-3 text-limeAccent-500" /> Abrir
                          </button>
                          <button
                            onClick={() => handleDelete(rec.id)}
                            className="text-rose-500 hover:text-rose-700 p-0.5"
                          >
                            <Trash2 className="w-3.5 h-3.5" />
                          </button>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {/* FLOATING MOBILE NAVIGATION BAR (Reference Match: Curved Dark Green Dock at Bottom) */}
          <div className="fixed bottom-3 left-1/2 -translate-x-1/2 w-[92%] max-w-md bg-pine-950/95 backdrop-blur-xl text-white rounded-full p-2 border border-pine-800 shadow-float z-40 flex items-center justify-between px-5">
            
            <button
              onClick={() => { setActiveTab('calculator'); setActiveSection('imovel'); }}
              className={`flex flex-col items-center gap-0.5 transition-all ${
                activeTab === 'calculator' && activeSection === 'imovel' ? 'text-limeAccent-400 scale-105' : 'text-slate-400 hover:text-white'
              }`}
            >
              <Home className="w-4 h-4" />
              <span className="text-[9px] font-extrabold">Início</span>
            </button>

            <button
              onClick={() => { setActiveTab('calculator'); setActiveSection('atributos'); }}
              className={`flex flex-col items-center gap-0.5 transition-all ${
                activeTab === 'calculator' && activeSection === 'atributos' ? 'text-limeAccent-400 scale-105' : 'text-slate-400 hover:text-white'
              }`}
            >
              <Sliders className="w-4 h-4" />
              <span className="text-[9px] font-extrabold">Ajustes</span>
            </button>

            {/* Central Elevated Action Circle (Reference Match: Send Icon in Green Circle) */}
            <button
              onClick={handleCopyWhatsApp}
              className="w-12 h-12 bg-limeAccent-400 text-pine-950 rounded-full flex items-center justify-center shadow-glow-lime -mt-6 active:scale-90 transition-all border-2 border-pine-950"
              title="Copiar Laudo p/ WhatsApp"
            >
              <Send className="w-5 h-5 font-bold" />
            </button>

            <button
              onClick={() => setActiveTab('analytics')}
              className={`flex flex-col items-center gap-0.5 transition-all ${
                activeTab === 'analytics' ? 'text-limeAccent-400 scale-105' : 'text-slate-400 hover:text-white'
              }`}
            >
              <PieChart className="w-4 h-4" />
              <span className="text-[9px] font-extrabold">Análise</span>
            </button>

            <button
              onClick={() => setActiveTab('history')}
              className={`flex flex-col items-center gap-0.5 transition-all ${
                activeTab === 'history' ? 'text-limeAccent-400 scale-105' : 'text-slate-400 hover:text-white'
              }`}
            >
              <FileText className="w-4 h-4" />
              <span className="text-[9px] font-extrabold">Histórico</span>
            </button>

          </div>

        </div>
      );
    }

    const container = document.getElementById('root');
    const root = createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
